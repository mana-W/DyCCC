[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dyccc"
version = "0.1.0"
description = "Dynamic Cell-Cell Communication Inference with graph neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "torch>=2.0",
  "torch-geometric>=2.3"
]

[project.scripts]
dyccc-run = "dyccc.pipeline:main"

[project.optional-dependencies]
resources = [
  "liana>=1.7",
  "omnipath>=1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dyccc = ["resources/*.csv"]
